<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f6f8" />
  <title>MaintainFlow</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <strong>MaintainFlow</strong>
      <span>Demo</span>
    </header>

    <section id="inputView" class="card">
      <div class="card-head">
        <h1>Tenant email</h1>
        <button id="clearBtn" class="text-btn" type="button">Clear</button>
      </div>

      <textarea id="emailInput" spellcheck="false">From: michael.chen@example.com
Subject: Strong gas smell near stove

Hi, Michael at 31 River View, East Perth. There is a strong smell of gas near the stove and it has become worse in the last 20 minutes. We have turned the stove off and opened the windows.</textarea>

      <div class="samples">
        <button type="button" data-sample="leak">Leak</button>
        <button type="button" data-sample="power">Power</button>
        <button type="button" data-sample="lock">Lock</button>
        <button type="button" data-sample="gas">Gas</button>
      </div>

      <button id="analyseBtn" class="primary" type="button">Process request</button>
    </section>

    <section id="resultView" class="card hidden" aria-live="polite">
      <div class="card-head">
        <h1>Maintenance job</h1>
        <button id="backBtn" class="text-btn" type="button">Back</button>
      </div>

      <div class="job-top">
        <div>
          <span class="label">Property</span>
          <strong id="propertyValue">—</strong>
        </div>
        <span id="priorityPill" class="priority">—</span>
      </div>

      <div class="job-row">
        <span class="label">Issue</span>
        <strong id="issueValue">—</strong>
      </div>

      <div class="job-row muted-row">
        <span class="label">Tenant</span>
        <span id="tenantValue">—</span>
      </div>

      <label class="label reply-label" for="replyValue">Reply</label>
      <textarea id="replyValue" class="reply" rows="4"></textarea>

      <div id="actions" class="actions">
        <button id="rejectBtn" class="secondary" type="button">Reject</button>
        <button id="approveBtn" class="primary small" type="button">Approve</button>
      </div>

      <div id="doneState" class="done hidden"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js" defer></script>
</body>
</html>
