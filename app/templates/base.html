<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MaintainFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/">MaintainFlow</a>
      <nav>
        <a href="/">Dashboard</a>
        <a class="button small" href="/requests/new">New request</a>
      </nav>
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="container footer">Human-in-the-loop demo • No automated contractor dispatch or legal decisions.</footer>
</body>
</html>
